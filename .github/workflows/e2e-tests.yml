name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Escolha o navegador para executar os testes (chrome ou firefox)'
        required: true
        default: 'chrome'
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          start: npm start
          browser: ${{ github.event.inputs.browser }}

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots-${{ github.event.inputs.browser }}
          path: cypress/screenshots

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ github.event.inputs.browser }}
          path: cypress/videos